<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;">
</body>
<script>
    const div = document.createElement('div') // created a container named div

    console.log(div);

    div.className = "main" // sets the classname to div 

    div.id = "MyId" // sets the id in div

    div.setAttribute('title','generated title') // sets the title in div

    div.title = ('title' , 'generated title') // same sets  the title to div 2nd method is this , 1st is above

    div.style.backgroundColor = 'orange' // sets the bg color in div container

    div.style.padding = "15px" // gives padding to div
    // div.innerText = "Chai aur Code" 

    const Text = document.createTextNode("CHAI aur CODE") // created a text node with the content given chai aur code which store this and further attached to body of html page

    div.appendChild(Text)  // attached the text node to the div container

    document.body.appendChild(div) // now finally the div container is attached to body of the html page and now the final text chai aur code will be displayed on the page
</script>
</html>

<!--

// innerText  =>  ye text ko overwrite krta hai reference value leke naki set krta hai sbse pehle

// createTextNode  =>  ye khud apna text node create krta hai na ki overwrite krta hai

-->
