<!-- 1. <!DOCTYPE html> aur <html>, <head>, <body>: Yeh bas har webpage ka basic dabba (skeleton) hota hai—VS Code mein ! likh kar Enter dabane se yeh apne aap aa jata hai!

2. <div> (Ek Khaali Box): Webpage ke alag-alag hisson ko group karne ke liye ek dabba hota hai.

3. <h1> se <h6> aur <p>: <h1> matlab badi heading, aur <p> matlab normal paragraph text.

4. <div> ek container/box hai jiske andar headings aur paragraphs hain 

5. id="title" (Unique Naam): Kisi ek specific tag ko pehchanne ka unique roll number (jaise ek class mein ek hi roll number hota hai)—JS mein ise document.getElementById('title') se pakadte hain.

6. class="heading" (Group Naam): Ek hi style ya category ke kai tags ko ek sath pakadne ka group naam—JS mein ise document.querySelector('.heading') se pakadte hain.

7. Jo kuch screen par dikhta hai, woh sab <body> ke andar hota hai 

8. style = "display : none;"   =>  ye likhe hue txt ko bhi diplay nhi krta hai

querySelector()  ->  
a) Matches returned	Only the first element in document order
b) Return type -	A single Element object
c) If nothing matches -	Returns null



querySelectorAll()  ->
a) Returns All matching elements in document order
b) Return type - A static NodeList (array-like collection)
c) If nothing matches - Returns an empty NodeList (length === 0)
