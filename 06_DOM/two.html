<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur Code</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class = "parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    const parent = document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children);
    console.log(parent.children[1]);
    console.log(parent.children[1].innerHTML);

    for(let i = 0;i<parent.children.length;i++){
        console.log(parent.children[i].innerHTML);
    }
    parent.children[1].style.color = 'orange'
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);

    const dayOne = document.querySelector('.day');
    console.log(dayOne.parentElement);
    console.log(dayOne.nextElementSibling);

    console.log("NODES : ",parent.childNodes);
</script>
</html>

<!--

With a dot ('.parent'): Searches for an element with class="parent" (like <div class="parent">).

 const parent = document.querySelector('.parent')   => ye indicate krta hai parent class ko

console.log(parent);   => ye dikhata hai jitni bhi cheeze hai parent class ke andar 

console.log(parent.children);   => ye HTML collection deta hai jo ki ek tarike se array ke form me rehta hai

console.log(parent.children[1]);   => ye output me 2nd class ka element aur uski class div container ke sath deta hai 1 pe kyuki starting 0 se hoti hai

console.log(parent.children[1].innerHTML);   => ye output me sirf vo element dega jo 2nd position pe hai aur bss uska naam dega class nhi

for(let i = 0;i<parent.children.length;i++){
        console.log(parent.children[i].innerHTML);
    }
        Output ->

        Monday
        Tuesday
        Wednesday
        Thursday

        => ye output me saare elements ke naam ko dega jo bhi hai div ke classes ke andar

// fir hum children lagake access krenge to ek array format mil jaega fir uske andr different index pe different values stored rhengi use hum [] lagake access kr skte hai simple

// fir uske andr ke text ko nikalne ke liye innerHTML ka use kr lenge bs simple
