<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur Code</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class = "parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    const parent = document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children);
    console.log(parent.children[1]);
</script>
</html>

<!--

With a dot ('.parent'): Searches for an element with class="parent" (like <div class="parent">).

 const parent = document.querySelector('.parent')   => ye indicate krta hai parent class ko

console.log(parent);   => ye dikhata hai jitni bhi cheeze hai parent class ke andar 

console.log(parent.children);   => ye HTML collection deta hai jo ki ek tarike se array ke form me rehta hai

console.log(parent.children[1]);   => ye output me 2nd class ka element deta hai 1 pe kyuki starting 0 se hoti hai
-->
